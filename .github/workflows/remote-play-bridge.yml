name: Remote Play bridge compile check

on:
  push:
    branches:
      - feature/remote-play-scaffold
    paths:
      - "remote_play/**"
      - ".github/workflows/remote-play-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-compile-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out PS-LIVE
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-16 g++-16 git

      - name: Configure pinned chiaki-ng-core and bridge check
        run: |
          cmake -S remote_play/bridge -B build/remote-play-bridge -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DLIBCHIAKING_CURL=OFF \
            -DLIBCHIAKING_CRYPTO_OPENSSL=OFF \
            -DLIBCHIAKING_MEDIA_OPUS=OFF

      - name: Build compile-check target
        run: |
          cmake --build build/remote-play-bridge --target media_bridge_compile_check --parallel 2
